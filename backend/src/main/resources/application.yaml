server:
  port: 8080
spring:
  datasource:
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://localhost:5432/medhub
  sql:
    init:
      platform: postgres
      mode: never
  jpa:
    database: postgresql
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jackson:
    visibility:
      field: none
      setter: none
      getter: any
      is-getter: any
    deserialization:
      fail-on-unknown-properties: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
jwt:
  secret:
    key: ${JWT_SECRET_KEY}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

medhub:
  security:
    encryption:
      key: ${ENCRYPTION_KEY}
    hashing:
      salt: ${HASHING_SALT}
  invitations:
    from-email: ${MAIL_FROM:noreply@medhub.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  doctor-self-signup:
    enabled: ${MEDHUB_DOCTOR_SELF_SIGNUP_ENABLED:false}
  appointments:
    max-upcoming-per-patient: ${MEDHUB_APPOINTMENTS_MAX_UPCOMING_PER_PATIENT:5}
database:
  admin:
    name: "Szymon"
    surname: "Lis"
    email: "szymon.lis@gmail.com"
    phoneNumber: "123456789"
    password: ${ADMIN_PASSWORD}
