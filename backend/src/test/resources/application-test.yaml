spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    google:
      genai:
        api-key: test-key
        chat:
          options:
            model: gemini-2.0-flash
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.GoogleGenAiAutoConfiguration

database:
  admin:
    name: "Admin"
    surname: "User"
    email: "admin@example.com"
    phoneNumber: "123456789"
    password: "admin"

jwt:
  secret:
    key: ${JWT_SECRET_KEY:4d65644875625365637265744b657947656e657261746564466f72546573747321}

medhub:
  security:
    encryption:
      key: "00000000000000000000000000000000"
    hashing:
      salt: "test-salt"
  doctor-self-signup:
    enabled: true
  appointments:
    max-upcoming-per-patient: 5
  ai:
    enabled: false
