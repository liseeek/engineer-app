services:
  db:
    image: postgres:16
    container_name: medhub-service-postgres-container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SMTP catcher: open http://localhost:8025 to read "sent" invitation emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: medhub-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medhub-backend-container
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEMO_PASSWORD=${DEMO_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - HASHING_SALT=${HASHING_SALT}
      # Variables strictly mapped from .env
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH}
      - MAIL_STARTTLS_ENABLE=${MAIL_STARTTLS_ENABLE}
      - MEDHUB_DOCTOR_SELF_SIGNUP_ENABLED=${MEDHUB_DOCTOR_SELF_SIGNUP_ENABLED}
      - MEDHUB_APPOINTMENTS_MAX_UPCOMING_PER_PATIENT=${MEDHUB_APPOINTMENTS_MAX_UPCOMING_PER_PATIENT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - MEDHUB_AI_ENABLED=${MEDHUB_AI_ENABLED}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  frontend:
    build:
      context: ./frontend/med-hub
      dockerfile: Dockerfile
      args:
        REACT_APP_DOCTOR_SIGNUP_ENABLED: ${REACT_APP_DOCTOR_SIGNUP_ENABLED}
    container_name: medhub-frontend-container
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: medhub-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-db-data:
